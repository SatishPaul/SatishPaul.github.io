<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Preferences · Satish Paul Brief</title>
  <link rel="stylesheet" href="../assets/css/frontier-style.css">
  <style>
    body{font-family:"Segoe UI",SegoeUI,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;margin:0;color:#0b1b33;background:#f2f6fb}
    .wrap{max-width:760px;margin:0 auto;padding:20px}
    .box{background:#fff;border:1px solid #d9e2ef;border-radius:16px;padding:20px}
    h1{margin:0 0 8px}
    p{color:#4f6077}
    label{display:block;margin:10px 0}
    input[type="email"]{width:100%;max-width:520px;padding:10px;border:1px solid #c7d3e3;border-radius:8px}
    .btn{display:inline-block;background:#0067b8;color:#fff;border:0;border-radius:999px;padding:10px 14px;font-weight:600;cursor:pointer}
    .msg{margin-top:10px;color:#0f766e;font-weight:600}
    .err{color:#b42318}
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="../">← Home</a></p>
    <section class="box">
      <h1>Manage preferences</h1>
      <p>Update your service-line selections. Changes are written to Power Platform when flow URLs are configured.</p>
      <form data-pp-form="preferences">
        <label>Work email
          <input type="email" name="email" required placeholder="name@company.com">
        </label>
        <label><input type="checkbox" name="industries" value="Tax"> Tax</label>
        <label><input type="checkbox" name="industries" value="Audit"> Audit</label>
        <label><input type="checkbox" name="industries" value="Advisory"> Advisory</label>
        <label><input type="checkbox" name="industries" value="IT Consulting"> IT Consulting</label>
        <button class="btn" type="submit">Save preferences</button>
        <div class="msg" data-msg></div>
      </form>
    </section>
  </div>
  <script src="../assets/js/site-config.js"></script>
  <script src="../assets/js/powerplatform-subscriptions.js"></script>
</body>
</html>
