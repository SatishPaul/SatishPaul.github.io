name: Daily Tax Audit IT Update

on:
  schedule:
    # GitHub cron is UTC. Run both DST windows for 06:30 America/New_York.
    - cron: "30 11 * * *" # 06:30 ET during EST
    - cron: "30 10 * * *" # 06:30 ET during EDT
  push:
    branches: [main]
    paths:
      - "scripts/daily-tax-audit-it-update.js"
      - ".github/workflows/daily-tax-audit-it-update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run daily scan
        run: npm run daily:update

      - name: Commit updated daily data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-articles.json
          if git diff --staged --quiet; then
            echo "No daily feed changes to commit."
          else
            git commit -m "chore: daily industry article refresh"
            git push
          fi
